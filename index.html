<!DOCTYPE html>
<html lang="ar" dir="rtl" style="color-scheme: light !important;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة قراءات الدوام - شعبة كبس غاز الرميلة الشمالية</title>
    <!-- استيراد خط Tajawal الفاخر -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light !important;
        }

        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 0;
        }

        html, body {
            background-color: #f8fafc !important;
            color: #0f172a !important;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .app-container {
            width: 100%;
            max-width: 750px;
            background: #ffffff !important;
            border-radius: 24px;
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08), 0 0 1px 1px rgba(15, 23, 42, 0.04);
            overflow: hidden;
            border: 1px solid #e2e8f0;
            animation: fadeIn 0.5s ease-out;
            margin-bottom: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .app-header {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            padding: 25px 20px;
            text-align: center;
            border-bottom: 2px solid #e2e8f0;
        }

        .app-header h3 {
            font-size: 13px;
            font-weight: 700;
            color: #64748b;
            margin-bottom: 5px;
        }

        .app-header h2 {
            font-size: 17px;
            font-weight: 800;
            line-height: 1.8;
            color: #1e293b !important;
        }

        .app-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background-color: #ffffff !important;
        }

        .table-header {
            display: grid;
            grid-template-columns: 0.8fr 1fr 1fr 1fr;
            gap: 8px;
            background: #f1f5f9;
            padding: 10px 12px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 12px;
            color: #475569;
            text-align: center;
            direction: ltr;
        }

        .row-item {
            display: grid;
            grid-template-columns: 0.8fr 1fr 1fr 1fr;
            gap: 8px;
            background: #fdfdfd;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            padding: 10px;
            align-items: center;
            transition: all 0.25s ease;
            direction: ltr;
        }

        .row-item.high-value {
            background: #fefce8 !important;
            border-color: #facc15 !important;
        }

        .time-label {
            font-size: 13px;
            font-weight: 800;
            color: #334155;
            text-align: center;
        }

        .row-item input {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            color: #0f172a;
            font-size: 14px;
            font-weight: 700;
            padding: 8px;
            text-align: center;
            outline: none;
            width: 100%;
        }

        .row-item input:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* قسم العمليات الإضافية والملاحظات المجدولة */
        .operations-section {
            margin-top: 10px;
            background: #fdfdfd;
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .operations-section h4 {
            font-size: 14px;
            font-weight: 800;
            color: #334155;
            border-bottom: 1.5px solid #e2e8f0;
            padding-bottom: 6px;
        }

        .op-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .op-group label {
            font-size: 13px;
            font-weight: 700;
            color: #475569;
        }

        .status-buttons {
            display: flex;
            gap: 10px;
        }

        .status-btn {
            flex: 1;
            padding: 9px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            border: 1.5px solid #cbd5e1;
            background: #ffffff;
            color: #64748b;
            transition: all 0.2s;
            text-align: center;
        }

        .status-btn.active-off {
            background: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #991b1b !important;
        }

        .status-btn.active-on {
            background: #dcfce7 !important;
            border-color: #22c55e !important;
            color: #166534 !important;
        }

        .pressures-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 5px;
            display: none;
        }

        .pressures-row.show {
            display: grid;
        }

        .pressures-row input {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 8px;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            outline: none;
            width: 100%;
        }

        .lines-pressures {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .line-box {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .line-box label {
            font-size: 12px;
            font-weight: 700;
            color: #64748b;
        }

        .line-box input {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 8px;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            outline: none;
        }

        .results-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 15px;
            padding-top: 20px;
            border-top: 2px dashed #e2e8f0;
        }

        @media (max-width: 550px) {
            .results-wrapper {
                grid-template-columns: 1fr;
            }
        }

        .result-box {
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 0.5;
            transition: all 0.3s ease;
        }

        .result-box.active-result {
            opacity: 1;
        }

        .result-box.primary-result {
            background: #f0fdf4;
            border-color: #22c55e;
        }

        .result-box label {
            font-size: 13px;
            font-weight: 800;
            color: #475569;
        }

        .result-box input {
            background: transparent;
            border: none;
            color: #0f172a;
            font-size: 20px;
            font-weight: 900;
            outline: none;
            width: 100%;
            text-align: center;
        }

        .result-box.primary-result input {
            color: #15803d;
        }

        .actions-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 15px;
        }

        .btn-clear {
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            color: #334155;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-clear:hover {
            background: #0f172a;
            color: white;
            border-color: #0f172a;
        }

        .signature-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #f1f5f9;
            font-size: 13px;
            font-weight: 800;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-header">
        <h3>Republic of Iraq / Ministry of Oil - South Gas Company</h3>
        <h2>شعبة كبس غاز الرميلة الشمالية</h2>
    </div>

    <div class="app-body">
        <!-- ترويسة الجدول -->
        <div class="table-header">
            <span>TIME</span>
            <span>GRID PRESSURE</span>
            <span>STRATJEC PRESSURE</span>
            <span>FLOW M³/HR</span>
        </div>

        <div id="rowsContainer"></div>

        <!-- قسم العمليات المتقدم (كابسة القطري، الخطوط، السولرات) -->
        <div class="operations-section">
            <h4>حالة المعدات والخطوط (Operations Status)</h4>
            
            <!-- كابسة القطري -->
            <div class="op-group">
                <label>كابسة القطري (Qutry Compressor):</label>
                <div class="status-buttons">
                    <button type="button" class="status-btn active-off" id="qutry_off" onclick="setQutryStatus('off')">متوقفة (OFF)</button>
                    <button type="button" class="status-btn" id="qutry_on" onclick="setQutryStatus('on')">بالعمل (ON)</button>
                </div>
            </div>

            <!-- الخط الوطني والخط الإيراني -->
            <div class="lines-pressures">
                <div class="line-box">
                    <label>الخط الوطني (National Line)</label>
                    <input type="number" id="nationalLine" placeholder="Pressure">
                </div>
                <div class="line-box">
                    <label>الخط الإيراني (Iranian Line)</label>
                    <input type="number" id="iranianLine" placeholder="Pressure">
                </div>
            </div>

            <!-- سولر A -->
            <div class="op-group">
                <label>سولر A (Solar A):</label>
                <div class="status-buttons">
                    <button type="button" class="status-btn active-off" id="solarA_off" onclick="setSolarStatus('A', 'off')">متوقفة (OFF)</button>
                    <button type="button" class="status-btn" id="solarA_on" onclick="setSolarStatus('A', 'on')">بالعمل (ON)</button>
                </div>
                <div class="pressures-row" id="solarA_pressures">
                    <input type="number" id="solarA_suc" placeholder="Suction Pressure">
                    <input type="number" id="solarA_dis" placeholder="Discharge Pressure">
                </div>
            </div>

            <!-- سولر B -->
            <div class="op-group">
                <label>سولر B (Solar B):</label>
                <div class="status-buttons">
                    <button type="button" class="status-btn active-off" id="solarB_off" onclick="setSolarStatus('B', 'off')">متوقفة (OFF)</button>
                    <button type="button" class="status-btn" id="solarB_on" onclick="setSolarStatus('B', 'on')">بالعمل (ON)</button>
                </div>
                <div class="pressures-row" id="solarB_pressures">
                    <input type="number" id="solarB_suc" placeholder="Suction Pressure">
                    <input type="number" id="solarB_dis" placeholder="Discharge Pressure">
                </div>
            </div>
        </div>

        <!-- النتائج النهائية -->
        <div class="results-wrapper">
            <div class="result-box" id="box1">
                <label>TOTAL</label>
                <input type="text" id="finalResult1" readonly value="-">
            </div>

            <div class="result-box primary-result" id="box2">
                <label>M³/DAY</label>
                <input type="text" id="finalResult2" readonly value="-">
            </div>
        </div>

        <div class="actions-row">
            <button type="button" class="btn-clear" onclick="resetForm()">تصفير الحقول</button>
        </div>

        <div class="signature-footer">
            تم التصميم بواسطة مصطفى قيس قاسم
        </div>
    </div>
</div>

<script>
    document.documentElement.style.backgroundColor = '#f8fafc';
    document.body.style.backgroundColor = '#f8fafc';

    let qutryState = 'off';
    let solarAState = 'off';
    let solarBState = 'off';

    function setQutryStatus(status) {
        qutryState = status;
        const offBtn = document.getElementById('qutry_off');
        const onBtn = document.getElementById('qutry_on');
        if (status === 'off') {
            offBtn.className = 'status-btn active-off';
            onBtn.className = 'status-btn';
        } else {
            offBtn.className = 'status-btn';
            onBtn.className = 'status-btn active-on';
        }
    }

    function setSolarStatus(solar, status) {
        if (solar === 'A') {
            solarAState = status;
            const offBtn = document.getElementById('solarA_off');
            const onBtn = document.getElementById('solarA_on');
            const pressRow = document.getElementById('solarA_pressures');
            if (status === 'off') {
                offBtn.className = 'status-btn active-off';
                onBtn.className = 'status-btn';
                pressRow.classList.remove('show');
            } else {
                offBtn.className = 'status-btn';
                onBtn.className = 'status-btn active-on';
                pressRow.classList.add('show');
            }
        } else {
            solarBState = status;
            const offBtn = document.getElementById('solarB_off');
            const onBtn = document.getElementById('solarB_on');
            const pressRow = document.getElementById('solarB_pressures');
            if (status === 'off') {
                offBtn.className = 'status-btn active-off';
                onBtn.className = 'status-btn';
                pressRow.classList.remove('show');
            } else {
                offBtn.className = 'status-btn';
                onBtn.className = 'status-btn active-on';
                pressRow.classList.add('show');
            }
        }
    }

    const hours = [
        "7:00", "9:00", "11:00",
        "13:00", "15:00", "17:00",
        "19:00", "21:00", "23:00",
        "1:00", "3:00", "5:00"
    ];

    const container = document.getElementById('rowsContainer');

    hours.forEach((hour, index) => {
        const row = document.createElement('div');
        row.className = 'row-item';
        row.id = `row_item_${index}`;
        row.innerHTML = `
            <div class="time-label">${hour}</div>
            <input type="number" id="grid_${index}" placeholder="Grid">
            <input type="number" id="strat_${index}" placeholder="Strat">
            <input type="number" id="flow_${index}" placeholder="Flow" oninput="checkValue(${index})">
        `;
        container.appendChild(row);
    });

    function checkValue(index) {
        const flowVal = parseFloat(document.getElementById(`flow_${index}`).value);
        const rowItem = document.getElementById(`row_item_${index}`);

        if (!isNaN(flowVal) && flowVal >= 50000) {
            rowItem.classList.add('high-value');
        } else {
            rowItem.classList.remove('high-value');
        }

        calculate();
    }

    function calculate() {
        let sum = 0;
        let filledCount = 0;

        for (let i = 0; i < hours.length; i++) {
            const valStr = document.getElementById(`flow_${i}`).value;
            if (valStr !== '' && !isNaN(valStr)) {
                sum += parseFloat(valStr);
                filledCount++;
            }
        }

        const box1 = document.getElementById('box1');
        const box2 = document.getElementById('box2');

        if (filledCount === hours.length) {
            const result1 = sum * 2;
            const result2 = result1 * 37.226;

            document.getElementById('finalResult1').value = formatNumber(result1);
            document.getElementById('finalResult2').value = formatNumber(result2);

            box1.classList.add('active-result');
            box2.classList.add('active-result');
        } else {
            document.getElementById('finalResult1').value = '-';
            document.getElementById('finalResult2').value = '-';

            box1.classList.remove('active-result');
            box2.classList.remove('active-result');
        }
    }

    function formatNumber(num) {
        if (Number.isInteger(num)) {
            return num.toLocaleString('en-US');
        }
        return num.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 3 });
    }

    function resetForm() {
        for (let i = 0; i < hours.length; i++) {
            document.getElementById(`grid_${i}`).value = '';
            document.getElementById(`strat_${i}`).value = '';
            document.getElementById(`flow_${i}`).value = '';
            document.getElementById(`row_item_${i}`).classList.remove('high-value');
        }
        document.getElementById('nationalLine').value = '';
        document.getElementById('iranianLine').value = '';
        document.getElementById('solarA_suc').value = '';
        document.getElementById('solarA_dis').value = '';
        document.getElementById('solarB_suc').value = '';
        document.getElementById('solarB_dis').value = '';

        setQutryStatus('off');
        setSolarStatus('A', 'off');
        setSolarStatus('B', 'off');
        calculate();
    }
</script>

</body>
</html>

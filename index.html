<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>استمارة قراءات الدوام - شعبة كبس غاز الرميلة الشمالية</title>
    
    <!-- استيراد الخطوط الاحترافية والفاخرة (عربي و إنكليزي) -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', 'Cairo', sans-serif; margin: 0; padding: 0; }
        html, body { background-color: #ffffff; width: 100%; min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow-x: hidden; }

        body.dark-mode { background-color: #0b0f19; color: #f8fafc; }
        body.dark-mode .mobile-container { background: #0b0f19; }
        body.dark-mode .header { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        body.dark-mode .app-body { background-color: #0b0f19 !important; }
        body.dark-mode .row-item { background: #1e293b !important; border-color: #334155 !important; }
        body.dark-mode .time-label, body.dark-mode .row-item input { color: #f8fafc !important; }
        body.dark-mode .operations-section { background: #1e293b !important; border-color: #334155 !important; }
        body.dark-mode .operations-section h4 { color: #f8fafc !important; }
        body.dark-mode .op-group label, body.dark-mode .line-box label { color: #94a3b8 !important; }
        body.dark-mode .status-btn { background: #0f172a !important; border-color: #334155 !important; color: #94a3b8 !important; }
        body.dark-mode .pressures-row input, body.dark-mode .line-box input { background: #0f172a !important; color: #f8fafc !important; border-color: #334155 !important; }

        .mobile-container { background: #ffffff; width: 100%; max-width: 820px; min-height: 100vh; position: relative; display: flex; flex-direction: column; box-shadow: 0 0 40px rgba(0,0,0,0.08); }

        .header { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; padding: 35px 20px 30px 20px; text-align: center; border-bottom-left-radius: 35px; border-bottom-right-radius: 35px; position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.15); flex-shrink: 0; }
        .header h3 { font-size: 0.78rem; color: #94a3b8; font-weight: 600; margin-bottom: 4px; letter-spacing: 0.3px; }
        .header h1 { font-family: 'Cairo', sans-serif; font-size: 1.4rem; font-weight: 800; color: #f8fafc; letter-spacing: 0.5px; }

        .menu-dropdown-container { position: absolute; top: 18px; right: 18px; z-index: 50; }
        .hamburger-btn { background: rgba(255, 255, 255, 0.15); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.25); width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; }
        
        .dropdown-menu { position: absolute; top: 48px; right: 0; background: #ffffff; border-radius: 14px; box-shadow: 0 10px 25px rgba(15, 23, 42, 0.2); width: 180px; display: none; flex-direction: column; overflow: hidden; border: 1px solid #e2e8f0; text-align: right; z-index: 100; }
        .dropdown-menu.show { display: flex; }
        .dropdown-item { padding: 12px 16px; font-size: 0.85rem; font-weight: 700; color: #0f172a; display: flex; align-items: center; gap: 10px; cursor: pointer; background: #ffffff; }
        .dropdown-item:hover { background: #f8fafc; color: #0d9488; }

        .app-body { padding: 22px 18px; flex: 1; overflow-y: auto; width: 100%; max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; background-color: #ffffff; }

        .table-header { display: grid; grid-template-columns: 0.8fr 1fr 1fr 1fr; gap: 8px; background: #f1f5f9; padding: 10px 12px; border-radius: 10px; font-weight: 800; font-size: 12px; color: #475569; text-align: center; direction: ltr; letter-spacing: 0.3px; }

        .row-item { display: grid; grid-template-columns: 0.8fr 1fr 1fr 1fr; gap: 8px; background: #fdfdfd; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 10px; align-items: center; transition: all 0.25s ease; direction: ltr; }
        .row-item.high-value { background: #fefce8 !important; border-color: #facc15 !important; }

        .time-label { font-size: 13px; font-weight: 800; color: #334155; text-align: center; font-family: 'Plus Jakarta Sans', sans-serif; }

        .row-item input, .pressures-row input, .line-box input {
            background: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px; color: #0f172a; font-size: 14px; font-weight: 700; padding: 8px; text-align: center; outline: none; width: 100%; font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .row-item input:focus, .pressures-row input:focus, .line-box input:focus { border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        .operations-section { margin-top: 10px; background: #fdfdfd; border: 1.5px solid #e2e8f0; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px; text-align: right; }
        .operations-section h4 { font-size: 14px; font-weight: 800; color: #334155; border-bottom: 1.5px solid #e2e8f0; padding-bottom: 6px; font-family: 'Cairo', sans-serif; }

        .op-group { display: flex; flex-direction: column; gap: 8px; }
        .op-group label, .line-box label { font-size: 13px; font-weight: 700; color: #475569; }

        .status-buttons { display: flex; gap: 10px; }
        .status-btn { flex: 1; padding: 9px; border-radius: 10px; font-size: 13px; font-weight: 800; cursor: pointer; border: 1.5px solid #cbd5e1; background: #ffffff; color: #64748b; transition: all 0.2s; text-align: center; }
        .status-btn.active-off { background: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b !important; }
        .status-btn.active-on { background: #dcfce7 !important; border-color: #22c55e !important; color: #166534 !important; }

        .pressures-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px; display: none; direction: ltr; }
        .pressures-row.show { display: grid; }

        .lines-pressures { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; direction: ltr; text-align: right; }
        .line-box { display: flex; flex-direction: column; gap: 5px; }

        .results-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 15px; padding-top: 20px; border-top: 2px dashed #e2e8f0; }
        @media (max-width: 550px) { .results-wrapper { grid-template-columns: 1fr; } }

        .result-box { background: #f8fafc; border: 2px solid #cbd5e1; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px; opacity: 0.5; transition: all 0.3s ease; text-align: right; }
        .result-box.active-result { opacity: 1; }
        .result-box.primary-result { background: #f0fdf4; border-color: #22c55e; }
        .result-box label { font-size: 13px; font-weight: 800; color: #475569; font-family: 'Cairo', sans-serif; }
        .result-box input { background: transparent; border: none; color: #0f172a; font-size: 20px; font-weight: 900; outline: none; width: 100%; text-align: center; font-family: 'Plus Jakarta Sans', sans-serif; }
        .result-box.primary-result input { color: #15803d; }

        .actions-row { display: flex; justify-content: flex-end; margin-top: 15px; }
        .btn-clear { background: #ffffff; border: 1.5px solid #cbd5e1; color: #334155; padding: 10px 24px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .btn-clear:hover { background: #0f172a; color: white; border-color: #0f172a; }

        .footer { text-align: center; padding: 14px; color: #64748b; font-size: 0.8rem; font-weight: 700; margin-top: auto; border-top: 1px solid #e2e8f0; background: #f8fafc; font-family: 'Cairo', sans-serif; }
        body.dark-mode .footer { background: #1e293b; color: #94a3b8; border-color: #334155; }
    </style>
</head>
<body>

    <div class="mobile-container">
        
        <div class="header">
            <div class="menu-dropdown-container">
                <button type="button" class="hamburger-btn" onclick="toggleDropdown()"><i class="fa-solid fa-bars"></i></button>
                <div class="dropdown-menu" id="dropdownMenu">
                    <div class="dropdown-item" onclick="toggleDarkMode()"><i class="fa-solid fa-moon" style="color:#6366f1;"></i> المظهر الداكن</div>
                </div>
            </div>
            <h3>Republic of Iraq / Ministry of Oil - South Gas Company</h3>
            <h1>شعبة كبس غاز الرميلة الشمالية</h1>
        </div>

        <div class="app-body">
            <!-- ترويسة الجدول -->
            <div class="table-header">
                <span>TIME</span>
                <span>GRID PRESSURE</span>
                <span>STRATJEC PRESSURE</span>
                <span>FLOW M³/HR</span>
            </div>

            <div id="rowsContainer"></div>

            <!-- قسم العمليات والمعدات والخطوط -->
            <div class="operations-section">
                <h4>حالة المعدات والخطوط (Operations Status)</h4>
                
                <!-- كابسة القطري -->
                <div class="op-group">
                    <label>كابسة القطري (Qutry Compressor):</label>
                    <div class="status-buttons">
                        <button type="button" class="status-btn active-off" id="qutry_off" onclick="setQutryStatus('off')">متوقفة (OFF)</button>
                        <button type="button" class="status-btn" id="qutry_on" onclick="setQutryStatus('on')">بالعمل (ON)</button>
                    </div>
                </div>

                <!-- الخط الوطني والخط الإيراني -->
                <div class="lines-pressures">
                    <div class="line-box">
                        <label>الخط الوطني (National Line)</label>
                        <input type="number" id="nationalLine" placeholder="Pressure">
                    </div>
                    <div class="line-box">
                        <label>الخط الإيراني (Iranian Line)</label>
                        <input type="number" id="iranianLine" placeholder="Pressure">
                    </div>
                </div>

                <!-- سولر A -->
                <div class="op-group">
                    <label>سولر A (Solar A):</label>
                    <div class="status-buttons">
                        <button type="button" class="status-btn active-off" id="solarA_off" onclick="setSolarStatus('A', 'off')">متوقفة (OFF)</button>
                        <button type="button" class="status-btn" id="solarA_on" onclick="setSolarStatus('A', 'on')">بالعمل (ON)</button>
                    </div>
                    <div class="pressures-row" id="solarA_pressures">
                        <input type="number" id="solarA_suc" placeholder="Suction Pressure">
                        <input type="number" id="solarA_dis" placeholder="Discharge Pressure">
                    </div>
                </div>

                <!-- سولر B -->
                <div class="op-group">
                    <label>سولر B (Solar B):</label>
                    <div class="status-buttons">
                        <button type="button" class="status-btn active-off" id="solarB_off" onclick="setSolarStatus('B', 'off')">متوقفة (OFF)</button>
                        <button type="button" class="status-btn" id="solarB_on" onclick="setSolarStatus('B', 'on')">بالعمل (ON)</button>
                    </div>
                    <div class="pressures-row" id="solarB_pressures">
                        <input type="number" id="solarB_suc" placeholder="Suction Pressure">
                        <input type="number" id="solarB_dis" placeholder="Discharge Pressure">
                    </div>
                </div>
            </div>

            <!-- النتائج النهائية -->
            <div class="results-wrapper">
                <div class="result-box" id="box1">
                    <label>TOTAL</label>
                    <input type="text" id="finalResult1" readonly value="-">
                </div>

                <div class="result-box primary-result" id="box2">
                    <label>M³/DAY</label>
                    <input type="text" id="finalResult2" readonly value="-">
                </div>
            </div>

            <div class="actions-row">
                <button type="button" class="btn-clear" onclick="resetForm()">تصفير الحقول</button>
            </div>
        </div>

        <div class="footer">تم التصميم بواسطة مصطفى قيس قاسم © 2026</div>
    </div>

    <script>
        let qutryState = 'off';
        let solarAState = 'off';
        let solarBState = 'off';

        function toggleDropdown() { document.getElementById('dropdownMenu').classList.toggle('show'); }
        function toggleDarkMode() { document.body.classList.toggle('dark-mode'); toggleDropdown(); }

        function setQutryStatus(status) {
            qutryState = status;
            const offBtn = document.getElementById('qutry_off');
            const onBtn = document.getElementById('qutry_on');
            if (status === 'off') {
                offBtn.className = 'status-btn active-off';
                onBtn.className = 'status-btn';
            } else {
                offBtn.className = 'status-btn';
                onBtn.className = 'status-btn active-on';
            }
        }

        function setSolarStatus(solar, status) {
            if (solar === 'A') {
                solarAState = status;
                const offBtn = document.getElementById('solarA_off');
                const onBtn = document.getElementById('solarA_on');
                const pressRow = document.getElementById('solarA_pressures');
                if (status === 'off') {
                    offBtn.className = 'status-btn active-off';
                    onBtn.className = 'status-btn';
                    pressRow.classList.remove('show');
                } else {
                    offBtn.className = 'status-btn';
                    onBtn.className = 'status-btn active-on';
                    pressRow.classList.add('show');
                }
            } else {
                solarBState = status;
                const offBtn = document.getElementById('solarB_off');
                const onBtn = document.getElementById('solarB_on');
                const pressRow = document.getElementById('solarB_pressures');
                if (status === 'off') {
                    offBtn.className = 'status-btn active-off';
                    onBtn.className = 'status-btn';
                    pressRow.classList.remove('show');
                } else {
                    offBtn.className = 'status-btn';
                    onBtn.className = 'status-btn active-on';
                    pressRow.classList.add('show');
                }
            }
        }

        const hours = [
            "7:00", "9:00", "11:00",
            "13:00", "15:00", "17:00",
            "19:00", "21:00", "23:00",
            "1:00", "3:00", "5:00"
        ];

        const container = document.getElementById('rowsContainer');

        hours.forEach((hour, index) => {
            const row = document.createElement('div');
            row.className = 'row-item';
            row.id = `row_item_${index}`;
            row.innerHTML = `
                <div class="time-label">${hour}</div>
                <input type="number" id="grid_${index}" placeholder="Grid">
                <input type="number" id="strat_${index}" placeholder="Strat">
                <input type="number" id="flow_${index}" placeholder="Flow" oninput="checkValue(${index})">
            `;
            container.appendChild(row);
        });

        function checkValue(index) {
            const flowVal = parseFloat(document.getElementById(`flow_${index}`).value);
            const rowItem = document.getElementById(`row_item_${index}`);

            if (!isNaN(flowVal) && flowVal >= 50000) {
                rowItem.classList.add('high-value');
            } else {
                rowItem.classList.remove('high-value');
            }

            calculate();
        }

        function calculate() {
            let sum = 0;
            let filledCount = 0;

            for (let i = 0; i < hours.length; i++) {
                const valStr = document.getElementById(`flow_${i}`).value;
                if (valStr !== '' && !isNaN(valStr)) {
                    sum += parseFloat(valStr);
                    filledCount++;
                }
            }

            const box1 = document.getElementById('box1');
            const box2 = document.getElementById('box2');

            if (filledCount === hours.length) {
                const result1 = sum * 2;
                const result2 = result1 * 37.226;

                document.getElementById('finalResult1').value = formatNumber(result1);
                document.getElementById('finalResult2').value = formatNumber(result2);

                box1.classList.add('active-result');
                box2.classList.add('active-result');
            } else {
                document.getElementById('finalResult1').value = '-';
                document.getElementById('finalResult2').value = '-';

                box1.classList.remove('active-result');
                box2.classList.remove('active-result');
            }
        }

        function formatNumber(num) {
            if (Number.isInteger(num)) {
                return num.toLocaleString('en-US');
            }
            return num.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 3 });
        }

        function resetForm() {
            for (let i = 0; i < hours.length; i++) {
                document.getElementById(`grid_${i}`).value = '';
                document.getElementById(`strat_${i}`).value = '';
                document.getElementById(`flow_${i}`).value = '';
                document.getElementById(`row_item_${i}`).classList.remove('high-value');
            }
            document.getElementById('nationalLine').value = '';
            document.getElementById('iranianLine').value = '';
            document.getElementById('solarA_suc').value = '';
            document.getElementById('solarA_dis').value = '';
            document.getElementById('solarB_suc').value = '';
            document.getElementById('solarB_dis').value = '';

            setQutryStatus('off');
            setSolarStatus('A', 'off');
            setSolarStatus('B', 'off');
            calculate();
        }
    </script>
</body>
</html>
